[project]
name = "student-course-management-system"
version = "0.1.0"
description = "Console-based Student Course Management System"
authors = [
    {name = "iToussaint",email = "toussaint.iradukunda@amalitech.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)"
]

[tool.ruff]
line-length = 79  # PEP 8 maximum

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, naming, docstrings
select = ["E", "W", "F", "I", "N", "D"]
# __init__ args are documented in the class docstring; magic methods are self-explanatory
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
